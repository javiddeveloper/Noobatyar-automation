<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F0F0F">
    <title>نوبت‌یار</title>
    <style>
        /*
         * No-white-flash background per docs/OWNER_WEB_PLAN.md section 7.3:
         * the wasm bundle takes a couple of seconds to boot, and until it
         * does the browser is showing this document as-is. #0F0F0F matches
         * ui/theme/Color.kt's DarkBackground exactly, and the wasmJs default
         * theme is dark (PreferencesManager.wasmJs.kt, section 7.2), so this
         * is the color that's actually correct to show first, not a filler.
         */
        html, body {
            background: #0F0F0F;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /*
         * Same Yakan Bold the app itself uses (ui/theme/Typography.kt), not a
         * system-font stand-in — this text renders before the wasm bundle
         * (and with it Compose's own font loading) exists, so it needs its
         * own @font-face pointed at the same file Compose Resources packs
         * for wasmJs: composeResources/<module>/font/, confirmed by reading
         * the actual build output rather than guessed.
         */
        @font-face {
            font-family: "Yakan";
            src: url("composeResources/proqueue.composeapp.generated.resources/font/yakan_bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }

        #compose-loading {
            position: fixed;
            inset: 0;
            z-index: 1;
            /* Opaque on purpose: #compose-root sits right underneath and
               starts painting as soon as Compose mounts, which can be well
               before the minimum-display timer lets this overlay fade —
               without its own background it would be transparent and the
               app would show through early. */
            background: #0F0F0F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-family: "Yakan", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #EDE9FE;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: opacity 0.25s ease;
        }

        #compose-loading.nb-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /*
         * Compose mounts into this sibling instead of document.body directly
         * (see main.kt): ComposeViewport takes ownership of whatever element
         * it's given and clears its content, which would wipe #compose-loading
         * out from under it the instant the wasm module finishes booting —
         * before the minimum-display timer below ever got a say. Keeping them
         * as separate elements means Compose can mount and start rendering
         * underneath while the loading screen keeps covering it on top.
         */
        #compose-root {
            position: fixed;
            inset: 0;
        }

        /*
         * Same mark as backend/templates/admin/base_site.html's inline SVG
         * (the ring + checkmark, amber dot fixed per docs/BRAND_GUIDE_FOR_AI.md
         * — the one brand accent that never re-tints). The mark itself stays
         * still — a spinning checkmark reads as "wrong", not "loading" — and
         * a separate progress ring orbits around it instead, the same shape
         * as a determinate loader even though it has nothing real to report
         * yet (there is no boot-progress signal this early).
         */
        #compose-loading .nb-mark-wrap {
            position: relative;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25), rgba(139, 92, 246, 0) 70%);
        }

        /*
         * The ring: a conic sweep clipped to an annulus with a radial mask.
         * -8px on all sides puts it just outside the mark, not touching it.
         */
        #compose-loading .nb-mark-wrap::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(167, 139, 250, 0.15) 60deg,
                #A78BFA 300deg,
                #C4B5FD 330deg,
                transparent 360deg
            );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            animation: nb-spin 1.1s linear infinite;
        }

        #compose-loading .nb-mark {
            width: 56px;
            height: 56px;
            color: #A78BFA;
        }

        @keyframes nb-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            #compose-loading .nb-mark-wrap::before { animation: none; }
        }
    </style>
</head>
<body>
    <div id="compose-root"></div>
    <div id="compose-loading">
        <div class="nb-mark-wrap">
            <svg class="nb-mark" viewBox="78 90 356 356" aria-hidden="true" focusable="false">
                <path d="M337.64 156.96A146 146 0 1 1 174.36 156.96"
                      fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round"/>
                <path d="M191 276L234 323L327 221"
                      fill="none" stroke="currentColor" stroke-width="36"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="256" cy="122" r="28" fill="#F59E0B"/>
            </svg>
        </div>
        <span>نوبت‌یار</span>
    </div>
    <script>
        // Boot-timer for the loading screen above: main.kt (wasmJsMain) calls
        // window.__nbHideLoading() once Compose has mounted into #compose-root
        // and started rendering. This enforces the loader staying on screen
        // for at least MIN_MS regardless of how fast the wasm module actually
        // loaded, so a warm-cache reload doesn't just flash the mark for a
        // frame — every refresh shows the same, deliberate boot moment.
        (function () {
            var MIN_MS = 2000;
            var bootStart = Date.now();
            window.__nbHideLoading = function () {
                var elapsed = Date.now() - bootStart;
                var remaining = Math.max(0, MIN_MS - elapsed);
                setTimeout(function () {
                    var el = document.getElementById("compose-loading");
                    if (el) el.classList.add("nb-hidden");
                }, remaining);
            };
        })();
    </script>
    <!--
      Firebase JS SDK (compat build) for FCM web push — see
      core/push/FirebaseMessagingInterop.kt and docs/OWNER_WEB_PLAN.md
      section 10.1. Vendored locally under vendor/firebase/ rather than
      loaded from Google's CDN: this app is served to users in Iran, where
      gstatic.com and most public CDNs are unreachable (see
      backend/docs/ADMIN_PANEL.md section 3 for the same constraint on the
      admin panel's fonts) — a CDN script tag wouldn't degrade gracefully
      for them, it would just never load, ever, for the whole audience.
      Serving it from this app's own origin instead means it loads exactly
      as reliably as composeApp.js itself. Must come before composeApp.js so
      the `firebase` global exists once Kotlin needs it. If it's missing for
      any other reason (a build that didn't get vendor/firebase/, e.g.), the
      interop layer checks `typeof firebase` itself and fails soft — no push
      token, everything else in the app works exactly the same.
    -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-messaging-compat.js"></script>
    <script src="composeApp.js"></script>
</body>
</html>
