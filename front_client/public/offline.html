<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#7c3aed" />
<title>نوبت‌یار | عدم اتصال به اینترنت</title>
<style>
  /* Static, self-contained fallback: served straight from the service
     worker's precache when navigation fails with no network, so it can't
     depend on anything the SW hasn't also cached (these two font files and
     the icon are in sw.js's PRECACHE_URLS). Colors are hardcoded rather than
     pulling in globals.css because this page is never built/processed by
     Next — it's a plain static file in public/. */
  @font-face {
    font-family: 'YekanBakh';
    src: url('/fonts/YekanBakhFaNum-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'YekanBakh';
    src: url('/fonts/YekanBakhFaNum-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root { color-scheme: light dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    font-family: 'YekanBakh', 'Vazirmatn', 'Tahoma', system-ui, sans-serif;
    background: #f9fafb;
    color: #111827;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #0f0f0f; color: #ffffff; }
    p { color: #9ca3af; }
  }

  .brand {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    margin-bottom: 22px;
  }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  p {
    font-size: 13px;
    line-height: 2;
    color: #6b7280;
    max-width: 300px;
    margin-bottom: 26px;
  }

  .retry-btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    background: #7c3aed;
    padding: 12px 28px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
  }
  .retry-btn:active { transform: scale(0.97); }
</style>
</head>
<body>
  <img class="brand" src="/icons/icon-192.png" alt="نوبت‌یار" width="84" height="84" />

  <h1>اتصال اینترنت برقرار نیست</h1>

  <p>
    این صفحه به دلیل قطع بودن اینترنت نمایش داده می‌شود
    <br />
    برای دیدن اطلاعات به‌روز و رزرو نوبت، دوباره به اینترنت وصل شوید
  </p>

  <button class="retry-btn" type="button" onclick="location.reload()">تلاش دوباره</button>
</body>
</html>
