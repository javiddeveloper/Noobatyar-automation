name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        working-directory: mobile_owner/composeApp
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > release.keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: composeApp/release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Remove keystore
        if: always()
        working-directory: mobile_owner/composeApp
        run: rm -f release.keystore.jks

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEST="composeApp/build/outputs/apk/release/Noobatyar-Owner-${{ steps.version.outputs.version_name }}.apk"
          mv "$SRC" "$DEST"
          echo "path=mobile_owner/${DEST}" >> "$GITHUB_OUTPUT"
          echo "name=Noobatyar-Owner-${{ steps.version.outputs.version_name }}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Send to Telegram
        working-directory: .
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${{ steps.apk.outputs.path }}" \
            -F caption="Noobatyar Owner ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
