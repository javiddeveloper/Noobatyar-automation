name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        working-directory: mobile_owner/composeApp
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > release.keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Remove keystore
        if: always()
        working-directory: mobile_owner/composeApp
        run: rm -f release.keystore.jks

      - name: Rename split APKs
        id: apk
        run: |
          OUT_DIR="composeApp/build/outputs/apk/release"
          DEST_DIR="composeApp/build/outputs/apk/release/dist"
          mkdir -p "$DEST_DIR"
          VERSION="${{ steps.version.outputs.version_name }}"
          for f in "$OUT_DIR"/*.apk; do
            base=$(basename "$f" .apk)
            # AGP names abi splits like composeApp-arm64-v8a-release.apk and the
            # fat one composeApp-release.apk (universal)
            arch=$(echo "$base" | sed -E 's/composeApp-(.*)-release/\1/; s/^composeApp-release$/universal/')
            cp "$f" "$DEST_DIR/Noobatyar-Owner-${VERSION}-${arch}.apk"
          done
          echo "dir=mobile_owner/$DEST_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify release APKs are properly configured
        working-directory: .
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          AAPT="${BUILD_TOOLS}aapt"
          EXPECTED_VERSION="${{ steps.version.outputs.version_name }}"
          EXPECTED_CODE="${{ steps.version.outputs.version_code }}"
          FAIL=0
          for f in "${{ steps.apk.outputs.dir }}"/*.apk; do
            echo "== Checking $f =="

            if ! "$APKSIGNER" verify "$f"; then
              echo "::error::$f is not properly signed"
              FAIL=1
            fi

            BADGING=$("$AAPT" dump badging "$f")

            if ! echo "$BADGING" | grep -q "versionName='${EXPECTED_VERSION}'"; then
              echo "::error::$f versionName does not match tag ${EXPECTED_VERSION}"
              FAIL=1
            fi

            if ! echo "$BADGING" | grep -q "versionCode='${EXPECTED_CODE}'"; then
              echo "::error::$f versionCode does not match expected ${EXPECTED_CODE}"
              FAIL=1
            fi

            if ! echo "$BADGING" | grep -q "package: name='xyz.sattar.javid.proqueue'"; then
              echo "::error::$f has unexpected applicationId"
              FAIL=1
            fi

            if echo "$BADGING" | grep -q "application-debuggable"; then
              echo "::error::$f is debuggable, must not ship a debuggable release build"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noobatyar-Owner-${{ steps.version.outputs.version_name }}
          path: ${{ steps.apk.outputs.dir }}/*.apk

      - name: Send to Telegram
        working-directory: .
        run: |
          for f in "${{ steps.apk.outputs.dir }}"/*.apk; do
            name=$(basename "$f")
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"$f" \
              -F caption="${name} (build ${{ steps.version.outputs.version_code }})"
          done
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
