name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        working-directory: mobile_owner/composeApp
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > release.keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        # "prod" flavor only — mobile_owner/composeApp/build.gradle.kts also
        # defines a "local" flavor for pointing at a dev backend (see
        # docs/ENVIRONMENTS.md); assembleRelease (no flavor) would build both
        # and land APKs under apk/{prod,local}/release instead of apk/release.
        run: ./gradlew :composeApp:assembleProdRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Remove keystore
        if: always()
        working-directory: mobile_owner/composeApp
        run: rm -f release.keystore.jks

      - name: Rename split APKs
        id: apk
        run: |
          OUT_DIR="composeApp/build/outputs/apk/prod/release"
          DEST_DIR="composeApp/build/outputs/apk/prod/release/dist"
          mkdir -p "$DEST_DIR"
          VERSION="${{ steps.version.outputs.version_name }}"
          for f in "$OUT_DIR"/*.apk; do
            base=$(basename "$f" .apk)
            # AGP names these composeApp-prod-arm64-v8a-release.apk and
            # composeApp-prod-universal-release.apk (splits.abi.isUniversalApk
            # makes "universal" an explicit abi name, not a special case)
            arch=$(echo "$base" | sed -E 's/composeApp-prod-(.*)-release/\1/')
            cp "$f" "$DEST_DIR/Noobatyar-Owner-${VERSION}-${arch}.apk"
          done
          echo "dir=mobile_owner/$DEST_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify release APKs are properly configured
        working-directory: .
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          AAPT="${BUILD_TOOLS}aapt"
          EXPECTED_VERSION="${{ steps.version.outputs.version_name }}"
          EXPECTED_CODE="${{ steps.version.outputs.version_code }}"
          FAIL=0
          for f in "${{ steps.apk.outputs.dir }}"/*.apk; do
            echo "== Checking $f =="

            if ! "$APKSIGNER" verify "$f"; then
              echo "::error::$f is not properly signed"
              FAIL=1
            fi

            BADGING=$("$AAPT" dump badging "$f")

            if ! echo "$BADGING" | grep -q "versionName='${EXPECTED_VERSION}'"; then
              echo "::error::$f versionName does not match tag ${EXPECTED_VERSION}"
              FAIL=1
            fi

            if ! echo "$BADGING" | grep -q "versionCode='${EXPECTED_CODE}'"; then
              echo "::error::$f versionCode does not match expected ${EXPECTED_CODE}"
              FAIL=1
            fi

            if ! echo "$BADGING" | grep -q "package: name='xyz.sattar.javid.proqueue'"; then
              echo "::error::$f has unexpected applicationId"
              FAIL=1
            fi

            if echo "$BADGING" | grep -q "application-debuggable"; then
              echo "::error::$f is debuggable, must not ship a debuggable release build"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noobatyar-Owner-${{ steps.version.outputs.version_name }}
          path: ${{ steps.apk.outputs.dir }}/*.apk

      - name: Send to Telegram
        working-directory: .
        run: |
          for f in "${{ steps.apk.outputs.dir }}"/*.apk; do
            name=$(basename "$f")
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"$f" \
              -F caption="${name} (build ${{ steps.version.outputs.version_code }})"
          done
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sync iOS version with tag
        working-directory: .
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          XCCONFIG="iosApp/Configuration/Config.xcconfig"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The tag checkout left us in detached HEAD, and actions/checkout
          # only fetched the tag ref, so fetch develop before branching off
          # a worktree for it. Editing there keeps this commit on top of the
          # latest tip instead of fighting the detached tree.
          rm -rf ../ios-version-sync
          git fetch origin develop:develop
          git worktree add ../ios-version-sync develop

          sed -i \
            -e "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${VERSION_NAME}/" \
            -e "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${VERSION_CODE}/" \
            "../ios-version-sync/mobile_owner/${XCCONFIG}"

          cd ../ios-version-sync
          if git diff --quiet -- "mobile_owner/${XCCONFIG}"; then
            echo "iOS version already up to date, nothing to commit."
          else
            git add "mobile_owner/${XCCONFIG}"
            git commit -m "chore: sync iOS version to ${VERSION_NAME} (${VERSION_CODE})"
            git push origin develop
          fi
