<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Android adaptive icon, FOREGROUND layer. Transparent — the gradient comes
       from ic_launcher_background.

       The mark is scaled to 0.78 about its own bbox centre, landing the artwork
       at ~53% of the canvas. Android guarantees only the inner 66% survives
       every launcher mask shape, and it also parallaxes this layer by a few
       percent, so the mark needs margin well beyond its own edges. -->
  <defs>
    <linearGradient id="fgDot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 260) scale(0.78) translate(-256 -268)">
    <path d="M337.64 156.96A146 146 0 1 1 174.36 156.96"
          fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <path d="M191 276L234 323L327 221"
          fill="none" stroke="#FFFFFF" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="122" r="28" fill="url(#fgDot)"/>
  </g>
</svg>
