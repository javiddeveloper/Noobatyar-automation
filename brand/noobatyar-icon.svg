<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="نوبت‌یار Noobatyar">
  <title>نوبت‌یار — Noobatyar</title>
  <defs>
    <linearGradient id="nbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="nbGlow" cx=".26" cy=".18" r=".9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nbDot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#nbBg)"/>
  <rect width="512" height="512" rx="114" fill="url(#nbGlow)"/>

  <!-- Open-top ring: reads as a clock face and as the bowl of the Persian ن -->
  <path d="M337.64 156.96A146 146 0 1 1 174.36 156.96"
        fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>

  <!-- Confirmed booking. Nudged up/right of true centre: a check carries its
       visual weight in the bottom-left elbow, so geometric centring reads low. -->
  <path d="M191 276L234 323L327 221"
        fill="none" stroke="#FFFFFF" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The dot of ن — and the marker for whose turn is next -->
  <circle cx="256" cy="122" r="28" fill="url(#nbDot)"/>
</svg>
