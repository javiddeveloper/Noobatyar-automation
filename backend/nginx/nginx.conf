upstream web_app {
    server web:8000;
}

upstream frontend_app {
    server frontend:3000;
}

# TLS parameters written inline rather than including
# /etc/letsencrypt/options-ssl-nginx.conf: that file ships with the
# python3-certbot-nginx plugin, which this setup does not install (certbot runs
# standalone on the host). Including a missing file stops nginx from starting.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# ── HTTP: ACME challenge + redirect to HTTPS ─────────────────────────────────
server {
    listen 80;
    server_name api.noobatyar.ir app.noobatyar.ir;

    # Renewal uses --standalone, so this path is only a fallback for a manual
    # webroot run. It must never be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTP on the bare IP ──────────────────────────────────────────────────────
# Deliberately still serving the app. Owner-app builds already in the field
# have http://93.127.223.93 compiled into BuildKonfig, so rejecting the IP
# would brick them. Remove this block once a domain-based app build has shipped
# and the old installs are gone.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ ^/(api|admin|plans|my-subscription|payment-result) {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API (Django) ─────────────────────────────────────────────────────────────
# One certificate covers both names; certbot files it under the first -d name,
# so both server blocks point at the api.noobatyar.ir directory.
server {
    listen 443 ssl;
    http2 on;
    server_name api.noobatyar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.noobatyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noobatyar.ir/privkey.pem;

    client_max_body_size 100M;

    location /static/ {
        alias /app/static/;
    }

    # Serializers build image URLs from the request host, so a client that
    # called the API over api.noobatyar.ir gets its media from here too.
    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

# ── Client web app (Next.js) ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.noobatyar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.noobatyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noobatyar.ir/privkey.pem;

    client_max_body_size 100M;

    # The Django paths are kept here on purpose even though the frontend is
    # built against https://api.noobatyar.ir: this block stays a superset of
    # what the old single-server config answered, so any relative /api/... call
    # left in the frontend keeps working instead of 404-ing after the cutover.
    location ~ ^/(api|admin|plans|my-subscription|payment-result) {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
