version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - AUTH_TYPE=scram-sha-256
    depends_on:
      - db
    restart: always

  redis:
    image: redis:7-alpine
    # volatile-lru, NOT allkeys-lru: accounting/usage.py stores paid credit
    # (`sms_wallet:{user_id}`, `appt_wallet:{user_id}`) with timeout=None, i.e.
    # no TTL. Under allkeys-lru Redis is free to evict those keys the moment it
    # hits maxmemory, silently destroying credit the user paid money for and
    # which has no other source of truth. volatile-lru restricts eviction to
    # keys that carry a TTL — the monthly usage counters
    # (`usage:{user_id}:{metric}:{YYYY-MM}`, ~62d TTL), OTP codes and throttle
    # buckets — all of which are cheap to lose. If memory does fill up, we would
    # rather get an OOM error on new writes than lose wallets.
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    restart: always

  web:
    build: .
    command: >
      gunicorn core.asgi:application
      -k uvicorn.workers.UvicornWorker
      --workers ${GUNICORN_WORKERS:-4}
      --bind 0.0.0.0:8000
      --timeout 60
      --graceful-timeout 30
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
      - DB_CONN_MAX_AGE=0
      - REDIS_URL=redis://redis:6379/1
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ZIBAL_MERCHANT_ID=${ZIBAL_MERCHANT_ID}
      - SITE_URL=${SITE_URL}
      - MELIPAYAMAK_OTP_TOKEN=${MELIPAYAMAK_OTP_TOKEN}
      - MELIPAYAMAK_FROM=${MELIPAYAMAK_FROM}
      # Path the Django admin is mounted at. Defaults to admin/ when unset.
      # WARNING: nginx/nginx.conf proxies to this service with
      #   location ~ ^/(api|admin|plans|my-subscription|payment-result)
      # so moving the admin off the default REQUIRES adding the new prefix to
      # that regex in both server blocks — otherwise nginx serves the frontend
      # (404) and the panel is simply unreachable from outside.
      - ADMIN_URL=${ADMIN_URL:-admin/}
    depends_on:
      - db
      - pgbouncer
      - redis
    restart: always

  frontend:
    build:
      context: ../front_client
      args:
        # Baked into the bundle at build time — changing it needs a rebuild of
        # this image, not just a restart.
        - NEXT_PUBLIC_API_URL=https://api.noobatyar.ir
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.noobatyar.ir

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificates are issued by certbot on the host; nginx only reads them.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
      - frontend
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
